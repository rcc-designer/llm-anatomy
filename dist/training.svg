<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">From tokens to trained weights</title><desc id="diagram-desc">Token inputs flow into transformer layers. Prediction error feeds a weight-update loop. At inference, trained weights generate the next token.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#799ab3" stroke-opacity=".12"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6ed5cf"/></marker></defs><rect width="600" height="450" fill="url(#grid)"/><g font-family="monospace" font-size="13" fill="#acbdcf"><text x="30" y="42">01 / TOKEN STREAM</text><text x="300" y="42">02 / LEARNED REPRESENTATIONS</text></g><g stroke="#50718d" fill="#112b43"><rect x="28" y="80" width="84" height="43"/><rect x="28" y="145" width="84" height="43"/><rect x="28" y="210" width="84" height="43"/></g><g fill="#e7f1f6" font-family="monospace" font-size="16"><text x="44" y="107">The</text><text x="44" y="172">model</text><text x="44" y="237">learns</text></g><g fill="none" stroke="#6ed5cf" stroke-width="1.5"><path d="M112 101H155V165H210" marker-end="url(#arrow)"/><path d="M112 166H210"/><path d="M112 231H155V166"/></g><g stroke="#6e94b0" fill="#11283f"><path d="M210 105L370 65L465 135L305 175Z"/><path d="M210 145L370 105L465 175L305 215Z"/><path d="M210 185L370 145L465 215L305 255Z"/><path d="M210 225L370 185L465 255L305 295Z"/></g><g fill="none" stroke="#6ed5cf" opacity=".7"><path d="M245 95L340 165M280 87L375 157M315 79L410 149M350 71L445 141M235 124L395 84M260 145L420 105M285 164L445 124"/></g><circle cx="337" cy="182" r="33" fill="#92e4db"/><text x="337" y="188" text-anchor="middle" font-family="monospace" font-size="16" fill="#092238">Δw</text><g fill="none" stroke="#6ed5cf" stroke-width="1.5"><path d="M465 255H520V335H395" marker-end="url(#arrow)"/><path d="M260 335H175V275H211" marker-end="url(#arrow)"/></g><rect x="260" y="312" width="135" height="46" fill="#142e45" stroke="#6ed5cf"/><text x="327" y="341" fill="#edf5fa" text-anchor="middle" font-family="monospace" font-size="14">Prediction loss</text><g fill="#acbdcf" font-family="monospace" font-size="12"><text x="28" y="400">TRAINING: UPDATE WEIGHTS ↺</text><text x="28" y="425">INFERENCE: USE LEARNED WEIGHTS → NEXT TOKEN</text></g></svg>